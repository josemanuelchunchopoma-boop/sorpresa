<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d25">
  <title>Para Lizbeth, con cariño</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #080d25;
      --blue: #9bcaff;
      --flower: #78aaff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background: var(--night);
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
    }

    .scene {
      position: relative;
      display: grid;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 90%, rgba(55, 73, 132, .35), transparent 48%),
        radial-gradient(ellipse at 78% 20%, rgba(38, 57, 114, .3), transparent 34%),
        linear-gradient(180deg, #080d25 0%, #101839 55%, #171d3a 100%);
    }

    .scene::before {
      position: absolute;
      z-index: -1;
      right: -12%;
      bottom: -37%;
      left: -12%;
      height: 60%;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(180deg, rgba(22, 35, 65, .1), #10172e 72%);
      content: "";
      filter: blur(3px);
    }

    .stars, .fireworks {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .stars { z-index: -1; }
    .fireworks { z-index: 1; }

    .heart-message {
      position: absolute;
      z-index: 3;
      top: 20%;
      left: 50%;
      color: #fff4fa;
      font-size: clamp(1.5rem, 6vw, 3rem);
      font-weight: 700;
      letter-spacing: .14em;
      opacity: 0;
      pointer-events: none;
      /* Texto extruido: capas de sombra que simulan grosor 3D + brillo */
      text-shadow:
        0 1px 0 #f9c2da, 0 2px 0 #f2a5c8, 0 3px 0 #e88ab6,
        0 4px 0 #db70a3, 0 5px 0 #c95a90, 0 6px 0 #b4497e,
        0 8px 6px rgba(20, 5, 30, .45),
        0 0 10px #fff, 0 0 24px #ff78b7, 0 0 48px #f04b9a;
      transform: translate(-50%, -50%) perspective(700px) translateZ(-400px) rotateX(70deg);
      transform-style: preserve-3d;
      white-space: nowrap;
      will-change: transform, opacity;
    }

    .heart-message.visible {
      animation: heart-message-3d 7.2s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes heart-message-3d {
      0% { opacity: 0; transform: translate(-50%, -50%) perspective(700px) translateZ(-400px) rotateX(70deg); }
      16% { opacity: 1; transform: translate(-50%, -50%) perspective(700px) translateZ(60px) rotateX(-10deg); }
      26% { transform: translate(-50%, -50%) perspective(700px) translateZ(0) rotateX(0) rotateY(0); }
      48% { transform: translate(-50%, -50%) perspective(700px) translateZ(20px) rotateX(8deg) rotateY(-16deg); }
      74% { opacity: 1; transform: translate(-50%, -50%) perspective(700px) translateZ(10px) rotateX(-6deg) rotateY(14deg); }
      100% { opacity: 0; transform: translate(-50%, -50%) perspective(700px) translateZ(180px) rotateX(0) rotateY(0); }
    }

    .loader {
      position: absolute;
      z-index: 5;
      display: grid;
      width: 100%;
      height: 100%;
      place-content: center;
      justify-items: center;
      gap: 16px;
      background:
        radial-gradient(ellipse at 50% 47%, rgba(40, 41, 92, .65), transparent 46%),
        linear-gradient(145deg, #100d2b, #080d25 70%);
      transition: opacity 1.1s ease, visibility 1.1s ease;
    }

    .loader.hidden { opacity: 0; visibility: hidden; }

    .loader-heart {
      width: clamp(130px, 24vw, 190px);
      overflow: visible;
      filter: drop-shadow(0 0 17px rgba(255, 93, 157, .4));
      animation: heartbeat 1.15s ease-in-out infinite, heart-turn 5s ease-in-out infinite;
    }

    @keyframes heart-turn {
      0%, 100% { transform: perspective(600px) rotateY(-26deg) rotateX(7deg); }
      50% { transform: perspective(600px) rotateY(26deg) rotateX(-7deg); }
    }

    .loader-title {
      margin: 4px 0 0;
      color: #ffe4f0;
      font-size: clamp(1.2rem, 4vw, 1.65rem);
      font-weight: 400;
      letter-spacing: .04em;
    }

    .loader-caption {
      margin: -8px 0 0;
      color: #c3b9d8;
      font: 500 .78rem/1.4 system-ui, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .percentage {
      min-width: 4ch;
      color: #ffd6e6;
      font: 600 1.1rem/1 system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
    }

    @keyframes heartbeat {
      50% { scale: 1.07; }
    }

    .moon {
      position: absolute;
      top: clamp(36px, 8vh, 82px);
      right: clamp(34px, 12vw, 165px);
      width: clamp(62px, 10vw, 104px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 32%, #fffdf2, #fff1c9 45%, #e8d49c 100%);
      box-shadow: 0 0 25px 5px rgba(255, 239, 190, .26), 0 0 90px 28px rgba(167, 188, 255, .12);
      opacity: 0;
      translate: calc(var(--mx, 0) * -14px) calc(var(--my, 0) * -9px);
      transform: translateY(-12px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }

    .moon::after {
      position: absolute;
      top: -5%;
      left: 23%;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #111936;
      content: "";
    }

    .night .moon { opacity: .95; transform: translateY(0); }

    .shooting-star {
      position: absolute;
      top: 18%;
      left: 6%;
      width: 120px;
      height: 1px;
      opacity: 0;
      background: linear-gradient(90deg, transparent, #d7e7ff 45%, #fff);
      box-shadow: 0 0 8px #a9caff;
      transform: rotate(24deg);
    }

    .shooting-star.one { animation: shoot 1.15s 3.8s ease-out both; }
    .shooting-star.two {
      top: 31%;
      left: 46%;
      width: 90px;
      animation: shoot 1.15s 6.2s ease-out both;
    }

    @keyframes shoot {
      0% { opacity: 0; transform: translate(0, 0) rotate(24deg); }
      10% { opacity: 1; }
      100% { opacity: 0; transform: translate(260px, 116px) rotate(24deg); }
    }

    .dedication {
      position: absolute;
      z-index: 2;
      top: clamp(19%, 25vh, 28%);
      left: 50%;
      width: min(700px, 88vw);
      min-height: 180px;
      text-align: center;
      translate: -50% 0;
      transform: perspective(1000px) rotateX(calc(var(--my, 0) * -5deg)) rotateY(calc(var(--mx, 0) * 7deg));
    }

    .dedication h1 {
      margin: 0 0 16px;
      color: #f6eaff;
      font-size: clamp(1.9rem, 6vw, 3.6rem);
      font-weight: 400;
      letter-spacing: .035em;
      opacity: 0;
      text-shadow: 0 1px 0 #cbb8f0, 0 2px 0 #a993d8, 0 3px 0 #8a76bd, 0 5px 8px rgba(5, 8, 30, .5), 0 0 24px rgba(195, 169, 255, .35);
      transform: perspective(700px) translateZ(-80px) rotateX(75deg);
      transform-origin: 50% 100%;
      transition: opacity 1.2s ease, transform 1.6s cubic-bezier(.2, .8, .2, 1);
    }

    .dedication p {
      perspective: 700px;
      min-height: 5.2em;
      margin: 0 auto;
      color: #d7dff7;
      font-size: clamp(1rem, 2.6vw, 1.3rem);
      line-height: 1.8;
      text-wrap: balance;
      text-shadow: 0 2px 12px #080d25;
    }

    .dedication h1.visible { opacity: 1; transform: none; }

    /* Cada palabra entra girando desde el fondo */
    .word {
      display: inline-block;
      transform-origin: 50% 100%;
      animation: word-in .95s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes word-in {
      from { opacity: 0; filter: blur(6px); transform: translate3d(0, .6em, -140px) rotateX(-85deg); }
      to { opacity: 1; filter: blur(0); transform: none; }
    }
    .cursor {
      display: inline-block;
      width: 1px;
      height: 1em;
      margin-left: 3px;
      vertical-align: -.12em;
      background: #c7a9ff;
      animation: blink .8s steps(2, start) infinite;
    }
    @keyframes blink { to { visibility: hidden; } }

    .garden {
      position: absolute;
      z-index: 2;
      right: 0;
      bottom: -7px;
      left: 0;
      display: flex;
      height: clamp(200px, 38vh, 330px);
      align-items: flex-end;
      justify-content: center;
      gap: clamp(2px, 3vw, 34px);
      opacity: 0;
      perspective: 900px;
      perspective-origin: calc(50% - var(--mx, 0) * 30%) 15%;
      translate: calc(var(--mx, 0) * 16px) 0;
      transform: translateY(35px);
      transition: opacity 1.3s ease, transform 1.5s cubic-bezier(.2, .8, .2, 1);
    }

    .night .garden { opacity: 1; transform: translateY(0); }

    /* Tulipanes en distintas profundidades (eje Z), crecen y giran en 3D */
    .tulip {
      width: clamp(86px, 17vw, 165px);
      height: 100%;
      overflow: visible;
      transform-origin: 50% 100%;
      translate: 0 0 var(--z, 0px);
      scale: 1 0;
      transition: scale 1.7s cubic-bezier(.2, .9, .3, 1.12) var(--grow-delay, 0s);
      animation: sway 4.4s ease-in-out infinite;
    }

    .night .tulip { scale: 1 1; }

    .tulip:nth-child(1) { --z: -110px; --grow-delay: .55s; filter: brightness(.78); }
    .tulip:nth-child(2) { --z: 20px; --grow-delay: .25s; height: 86%; animation-delay: -.8s; }
    .tulip:nth-child(3) { --z: -40px; --grow-delay: .1s; height: 96%; animation-delay: -1.5s; filter: brightness(.92); }
    .tulip:nth-child(4) { --z: 60px; --grow-delay: .4s; height: 77%; animation-delay: -.4s; }
    .tulip:nth-child(5) { --z: -80px; --grow-delay: .7s; height: 91%; animation-delay: -1.1s; filter: brightness(.84); }

    @keyframes sway {
      0%, 100% { transform: rotateZ(-2deg) rotateY(-18deg) rotateX(3deg); }
      50% { transform: rotateZ(2.4deg) rotateY(18deg) rotateX(-2deg); }
    }

    .stem { fill: none; stroke-linecap: round; }
    .stem-shine { fill: none; stroke: rgba(200, 240, 225, .28); stroke-width: 1.1; stroke-linecap: round; }

    .leaf {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: leaf-sway 3.4s ease-in-out infinite;
    }

    .leaf.right { animation-delay: -1.7s; }

    @keyframes leaf-sway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(4deg); }
    }

    .leaf-rib { fill: none; stroke: rgba(190, 235, 215, .22); stroke-width: .8; stroke-linecap: round; }

    .petal { stroke-width: .7; stroke-linejoin: round; }
    .vein { fill: none; stroke: rgba(235, 243, 255, .16); stroke-width: .55; stroke-linecap: round; }

    /* Los pétalos laterales "respiran": se abren y cierran levemente */
    .petal-left, .petal-right {
      transform-box: view-box;
      animation: petal-open 6s ease-in-out infinite;
    }

    .petal-left { transform-origin: 58px 112px; }
    .petal-right { transform-origin: 62px 112px; animation-name: petal-open-right; }

    @keyframes petal-open {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-5deg); }
    }

    @keyframes petal-open-right {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(5deg); }
    }

    .hills {
      position: absolute;
      z-index: 0;
      right: -5%;
      bottom: -1px;
      left: -5%;
      height: 20%;
      border-radius: 50% 50% 0 0 / 26% 26% 0 0;
      background: linear-gradient(180deg, #17283b, #0a1326 80%);
      box-shadow: 0 -12px 35px rgba(33, 51, 77, .22);
      translate: calc(var(--mx, 0) * 8px) 0;
    }

    .replay, .firework-again {
      position: absolute;
      z-index: 4;
      left: 22px;
      padding: 9px 13px;
      border: 1px solid rgba(223, 230, 255, .25);
      border-radius: 999px;
      background: rgba(11, 16, 40, .45);
      color: #d9e2ff;
      cursor: pointer;
      font: 500 .78rem system-ui, sans-serif;
      opacity: 0;
      transition: opacity .5s ease, background .2s ease;
    }

    .replay { top: 22px; }
    .firework-again { top: 64px; }
    .night .replay, .night .firework-again { opacity: .8; }
    .replay:hover, .firework-again:hover { background: rgba(50, 57, 98, .65); opacity: 1; }
    .replay:focus-visible, .firework-again:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    @media (max-height: 600px) {
      .dedication { top: 12%; }
      .dedication p { min-height: 4em; }
      .garden { height: 43vh; }
      .moon { top: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <canvas class="stars" id="stars" aria-hidden="true"></canvas>
    <canvas class="fireworks" id="fireworks" aria-hidden="true"></canvas>
    <div class="heart-message" id="heartMessage" aria-hidden="true">TE EXTRAÑO</div>
    <div class="moon" aria-hidden="true"></div>
    <div class="shooting-star one" aria-hidden="true"></div>
    <div class="shooting-star two" aria-hidden="true"></div>

    <section class="dedication" aria-live="polite">
      <h1 id="title">Para Lizbeth</h1>
      <p><span id="message"></span><span class="cursor" id="cursor" aria-hidden="true"></span></p>
    </section>

    <div class="hills" aria-hidden="true"></div>
    <div class="garden" id="garden" aria-hidden="true"></div>

    <button class="replay" id="replay" type="button">↻ Volver a ver</button>
    <button class="firework-again" id="fireworkAgain" type="button">♡ Repetir fuegos artificiales</button>

    <section class="loader" id="loader" aria-label="Preparando una sorpresa">
      <svg class="loader-heart" viewBox="0 0 200 180" role="img" aria-label="Un corazón se está llenando">
        <defs>
          <linearGradient id="heartGradient" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#ff8db8"/><stop offset="1" stop-color="#e63d83"/>
          </linearGradient>
          <clipPath id="heartClip">
            <path d="M100 169 C87 157 17 105 17 57 C17 17 68 8 100 48 C132 8 183 17 183 57 C183 105 113 157 100 169Z"/>
          </clipPath>
        </defs>
        <path d="M100 169 C87 157 17 105 17 57 C17 17 68 8 100 48 C132 8 183 17 183 57 C183 105 113 157 100 169Z" fill="#30223f" stroke="#ffb0cf" stroke-width="3"/>
        <rect id="heartFill" x="10" y="175" width="180" height="170" fill="url(#heartGradient)" clip-path="url(#heartClip)"/>
        <path d="M100 169 C87 157 17 105 17 57 C17 17 68 8 100 48 C132 8 183 17 183 57 C183 105 113 157 100 169Z" fill="none" stroke="#ffd6e6" stroke-width="2"/>
      </svg>
      <p class="loader-title">Una sorpresa para Lizbeth</p>
      <p class="loader-caption">Preparando algo bonito</p>
      <span class="percentage" id="percentage">0%</span>
    </section>
  </main>

  <script>
    (() => {
      const scene = document.getElementById("scene");
      const loader = document.getElementById("loader");
      const percentage = document.getElementById("percentage");
      const heartFill = document.getElementById("heartFill");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const cursor = document.getElementById("cursor");
      const heartMessage = document.getElementById("heartMessage");
      const starsCanvas = document.getElementById("stars");
      const fireworksCanvas = document.getElementById("fireworks");
      const starContext = starsCanvas.getContext("2d");
      const fireworkContext = fireworksCanvas.getContext("2d");
      const dedication = "Que esta noche te recuerde lo especial que eres. Ojalá cada estrella te regale un deseo, y cada día una razón nueva para sonreír. Gracias por iluminar, con tu forma de ser, el mundo de quienes tenemos la suerte de conocerte.";
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const FOCAL = 700;
      const pointer = { x: 0, y: 0, sx: 0, sy: 0 };
      const palettes = [
        ["255, 188, 221", "255, 239, 190", "174, 205, 255"],
        ["160, 200, 255", "205, 175, 255", "245, 248, 255"],
        ["255, 160, 200", "255, 215, 150", "255, 245, 232"],
        ["150, 235, 255", "190, 170, 255", "255, 200, 235"]
      ];
      let typingTimer;
      let fireworkTimer;
      let stars = [];
      let fireworks = [];
      let sparks = [];
      let lastTime = performance.now();

      const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));
      const easeInOutCubic = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const pick = list => list[Math.floor(Math.random() * list.length)];

      function randomUnit() {
        const u = Math.random() * 2 - 1;
        const a = Math.random() * Math.PI * 2;
        const r = Math.sqrt(1 - u * u);
        return [r * Math.cos(a), u, r * Math.sin(a)];
      }

      // Rota un punto alrededor del eje Y y luego del eje X
      function rotate(x, y, z, angleY, angleX) {
        const cy = Math.cos(angleY), sy = Math.sin(angleY);
        const x1 = x * cy + z * sy;
        const z1 = -x * sy + z * cy;
        const cx = Math.cos(angleX), sx = Math.sin(angleX);
        return [x1, y * cx - z1 * sx, y * sx + z1 * cx];
      }

      function drawGlow(ctx, x, y, radius, color, alpha) {
        if (alpha <= .01) return;
        ctx.fillStyle = `rgba(${color}, ${alpha * .14})`;
        ctx.beginPath();
        ctx.arc(x, y, radius * 3.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(${color}, ${alpha})`;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawParticle(ctx, p, x, y, radius, alpha) {
        if (p.px !== null && alpha > .02) {
          ctx.strokeStyle = `rgba(${p.color}, ${alpha * .55})`;
          ctx.lineWidth = radius * .9;
          ctx.beginPath();
          ctx.moveTo(p.px, p.py);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
        drawGlow(ctx, x, y, radius, p.color, alpha);
        p.px = x;
        p.py = y;
      }

      function createRocket(targetX, targetY, delay = 0) {
        return {
          x0: targetX + (Math.random() - .5) * 80,
          y0: window.innerHeight + 20,
          duration: .75 + Math.random() * .25,
          delay
        };
      }

      function stepRocket(ctx, fw, progress, dt) {
        const k = 1 - Math.pow(1 - progress, 3);
        const x = fw.rocket.x0 + (fw.cx - fw.rocket.x0) * k + Math.sin(progress * 10) * 3 * (1 - progress);
        const y = fw.rocket.y0 + (fw.cy - fw.rocket.y0) * k;
        for (let i = 0; i < 2; i++) {
          sparks.push({
            x, y,
            vx: (Math.random() - .5) * 30,
            vy: 20 + Math.random() * 40,
            life: .35 + Math.random() * .35,
            max: .7,
            radius: .7 + Math.random() * .9,
            color: "255, 222, 190"
          });
        }
        drawGlow(ctx, x, y, 2.4, "255, 245, 225", 1);
      }

      function drawFlash(ctx, x, y, strength, size) {
        const gradient = ctx.createRadialGradient(x, y, 0, x, y, size);
        gradient.addColorStop(0, `rgba(255, 236, 246, ${strength * .55})`);
        gradient.addColorStop(1, "rgba(255, 236, 246, 0)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Corazón volumétrico: contorno nítido + "carcasa" 3D inflada en el eje Z
      function createHeartFirework() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const size = Math.min(w, h) * .014;
        const cx = w * .5;
        const cy = Math.max(h * .2, size * 17 + 16);
        const count = w < 640 ? 260 : 400;
        const palette = palettes[0];
        const parts = [];
        for (let i = 0; i < count; i++) {
          const t = Math.random() * Math.PI * 2;
          const hx = 16 * Math.pow(Math.sin(t), 3);
          const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t) + 2.5;
          const outline = Math.random() < .5;
          const k = outline ? (Math.random() - .5) * .2 : Math.random() * 2 - 1;
          const shrink = outline ? 1 : Math.sqrt(1 - k * k) * (.82 + Math.random() * .18);
          const [dx, dy, dz] = randomUnit();
          const burst = size * (13 + Math.random() * 11);
          parts.push({
            tx: hx * shrink * size,
            ty: -hy * shrink * size,
            tz: k * size * 6.5,
            bx: dx * burst, by: dy * burst, bz: dz * burst,
            color: palette[i % 3],
            radius: (outline ? 1.5 : 1.05) + Math.random() * 1.1,
            phase: Math.random() * Math.PI * 2,
            fall: .6 + Math.random() * .9,
            drift: (Math.random() - .5) * 30,
            px: null, py: null
          });
        }
        return { type: "heart", t: 0, cx, cy, size, rocket: createRocket(cx, cy), parts, exploded: false, done: false };
      }

      function stepHeart(ctx, fw, dt) {
        fw.t += dt;
        const launch = fw.rocket.duration;
        if (fw.t < launch) {
          stepRocket(ctx, fw, fw.t / launch, dt);
          return;
        }
        if (!fw.exploded) {
          fw.exploded = true;
          showHeartMessage();
          if (!reduceMotion) {
            const w = window.innerWidth;
            const h = window.innerHeight;
            fireworks.push(createSphereFirework(w * .18, h * .3, .35));
            fireworks.push(createSphereFirework(w * .82, h * .26, .7));
          }
        }

        const e = fw.t - launch;
        const hold = 5.4;
        const dissolve = Math.max(0, e - hold);
        if (dissolve > 1.8) { fw.done = true; return; }

        const flash = 1 - e / .4;
        if (flash > 0) drawFlash(ctx, fw.cx, fw.cy, flash, fw.size * 14);

        const morph = easeInOutCubic(clamp((e - .35) / 1.25));
        const burst = 1 - Math.exp(-3.4 * e);
        const angleY = reduceMotion ? 0 : (1 - morph) * e * 2.4 + Math.sin(e * 1.1) * .62 + pointer.sx * .45;
        const angleX = reduceMotion ? 0 : Math.sin(e * .8) * .2 + pointer.sy * .3;
        const fade = 1 - dissolve / 1.8;

        for (const p of fw.parts) {
          const lx = p.bx * burst + (p.tx - p.bx * burst) * morph;
          const ly = p.by * burst + (p.ty - p.by * burst) * morph;
          const lz = p.bz * burst + (p.tz - p.bz * burst) * morph;
          const [rx, ry, rz] = rotate(lx, ly, lz, angleY, angleX);
          const scale = FOCAL / (FOCAL + rz);
          let x = fw.cx + rx * scale;
          let y = fw.cy + ry * scale + 22 * e * e * (1 - morph) * .3;
          let alpha = clamp(.55 + (scale - 1) * 2.6, .18, 1);
          if (dissolve > 0) {
            y += p.fall * 70 * dissolve * dissolve;
            x += p.drift * dissolve;
            alpha *= fade * (.55 + .45 * Math.sin(p.phase + e * 16));
          } else {
            alpha *= .82 + .18 * Math.sin(p.phase + e * 5);
          }
          drawParticle(ctx, p, x, y, p.radius * scale, alpha);
        }
      }

      // Fuego artificial esférico en 3D (los acompañantes y los que se lanzan con un toque)
      function createSphereFirework(cx, cy, delay = 0) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const palette = pick(palettes);
        const radius = Math.min(w, h) * (.11 + Math.random() * .07);
        const count = w < 640 ? 80 : 130;
        const parts = [];
        for (let i = 0; i < count; i++) {
          const [dx, dy, dz] = randomUnit();
          const reach = radius * (.85 + Math.random() * .15);
          parts.push({
            bx: dx * reach, by: dy * reach, bz: dz * reach,
            color: pick(palette),
            radius: .9 + Math.random() * 1.3,
            phase: Math.random() * Math.PI * 2,
            px: null, py: null
          });
        }
        return { type: "sphere", t: -delay, cx, cy, size: radius / 14, rocket: createRocket(cx, cy), parts, spin: (Math.random() - .5) * 1.4, done: false };
      }

      function stepSphere(ctx, fw, dt) {
        fw.t += dt;
        if (fw.t < 0) return;
        const launch = fw.rocket.duration;
        if (fw.t < launch) {
          stepRocket(ctx, fw, fw.t / launch, dt);
          return;
        }
        const e = fw.t - launch;
        const life = 2.3;
        if (e > life) { fw.done = true; return; }
        const flash = 1 - e / .3;
        if (flash > 0) drawFlash(ctx, fw.cx, fw.cy, flash * .7, fw.size * 10);
        const burst = 1 - Math.exp(-3.2 * e);
        const angleY = reduceMotion ? 0 : e * fw.spin + pointer.sx * .3;
        const angleX = reduceMotion ? 0 : .35 + pointer.sy * .25;
        const fade = Math.pow(1 - e / life, 1.3);
        for (const p of fw.parts) {
          const [rx, ry, rz] = rotate(p.bx * burst, p.by * burst, p.bz * burst, angleY, angleX);
          const scale = FOCAL / (FOCAL + rz);
          const x = fw.cx + rx * scale;
          const y = fw.cy + ry * scale + 45 * e * e;
          let alpha = clamp(.55 + (scale - 1) * 2.4, .15, 1) * fade;
          if (e > life * .55) alpha *= .5 + .5 * Math.sin(p.phase + e * 18);
          drawParticle(ctx, p, x, y, p.radius * scale, alpha);
        }
      }

      function stepSparks(ctx, dt) {
        sparks = sparks.filter(s => s.life > 0);
        for (const s of sparks) {
          s.life -= dt;
          s.vy += 140 * dt;
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          drawGlow(ctx, s.x, s.y, s.radius, s.color, clamp(s.life / s.max));
        }
      }

      function showHeartMessage() {
        heartMessage.classList.remove("visible");
        void heartMessage.offsetWidth;
        heartMessage.classList.add("visible");
      }

      function resizeCanvases() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        for (const canvas of [starsCanvas, fireworksCanvas]) {
          canvas.width = Math.round(window.innerWidth * ratio);
          canvas.height = Math.round(window.innerHeight * ratio);
          canvas.style.width = `${window.innerWidth}px`;
          canvas.style.height = `${window.innerHeight}px`;
          canvas.getContext("2d").setTransform(ratio, 0, 0, ratio, 0, 0);
        }
        stars = Array.from({ length: Math.min(150, Math.floor(window.innerWidth / 8)) }, () => ({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight * .78,
          radius: Math.random() * 1.35 + .25,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 1.5 + .5,
          depth: .15 + Math.random() * .85
        }));
      }

      // Estrellas con profundidad: las cercanas se mueven más (paralaje)
      function drawStars(dt) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        starContext.clearRect(0, 0, w, h);
        for (const star of stars) {
          star.phase += star.speed * dt;
          if (!reduceMotion) star.x = (star.x + star.depth * 3 * dt + w) % w;
          const alpha = (.3 + (Math.sin(star.phase) + 1) * .32) * (.55 + star.depth * .45);
          const x = star.x - pointer.sx * 26 * star.depth;
          const y = star.y - pointer.sy * 16 * star.depth;
          const radius = star.radius * (.6 + star.depth * .6);
          starContext.beginPath();
          starContext.arc(x, y, radius, 0, Math.PI * 2);
          starContext.fillStyle = `rgba(226, 235, 255, ${alpha})`;
          starContext.fill();
          if (radius > 1.2 && alpha > .7) {
            starContext.strokeStyle = `rgba(226, 235, 255, ${(alpha - .7) * 1.4})`;
            starContext.lineWidth = .6;
            starContext.beginPath();
            starContext.moveTo(x - radius * 4, y); starContext.lineTo(x + radius * 4, y);
            starContext.moveTo(x, y - radius * 4); starContext.lineTo(x, y + radius * 4);
            starContext.stroke();
          }
        }
      }

      function frame(now) {
        const dt = Math.min((now - lastTime) / 1000, .05);
        lastTime = now;
        const follow = Math.min(1, dt * 3);
        pointer.sx += (pointer.x - pointer.sx) * follow;
        pointer.sy += (pointer.y - pointer.sy) * follow;
        scene.style.setProperty("--mx", pointer.sx.toFixed(3));
        scene.style.setProperty("--my", pointer.sy.toFixed(3));

        drawStars(dt);

        fireworkContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
        fireworkContext.globalCompositeOperation = "lighter";
        fireworkContext.lineCap = "round";
        for (const fw of fireworks) {
          if (fw.type === "heart") stepHeart(fireworkContext, fw, dt);
          else stepSphere(fireworkContext, fw, dt);
        }
        fireworks = fireworks.filter(fw => !fw.done);
        stepSparks(fireworkContext, dt);
        fireworkContext.globalCompositeOperation = "source-over";
        requestAnimationFrame(frame);
      }

      function launchHeartFirework() {
        heartMessage.classList.remove("visible");
        fireworks = fireworks.filter(fw => fw.type !== "heart");
        fireworks.push(createHeartFirework());
      }

      function typeDedication() {
        clearInterval(typingTimer);
        message.textContent = "";
        cursor.style.display = "inline-block";
        title.classList.add("visible");
        const words = dedication.split(/\s+/);
        let index = 0;
        typingTimer = setInterval(() => {
          if (index > 0) message.append(" ");
          const word = document.createElement("span");
          word.className = "word";
          word.textContent = words[index];
          message.append(word);
          index += 1;
          if (index >= words.length) {
            clearInterval(typingTimer);
            cursor.style.display = "none";
            fireworkTimer = setTimeout(launchHeartFirework, 450);
          }
        }, 320);
      }

      function startScene() {
        clearTimeout(fireworkTimer);
        fireworks = [];
        sparks = [];
        heartMessage.classList.remove("visible");
        scene.classList.remove("night");
        title.classList.remove("visible");
        message.textContent = "";
        cursor.style.display = "inline-block";
        loader.classList.remove("hidden");
        percentage.textContent = "0%";
        heartFill.setAttribute("y", "175");
        heartFill.setAttribute("height", "0");

        const duration = 5000;
        const started = performance.now();
        function load(now) {
          const progress = Math.min((now - started) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 2);
          const percent = Math.floor(progress * 100);
          percentage.textContent = `${percent}%`;
          const fillHeight = eased * 170;
          heartFill.setAttribute("y", String(175 - fillHeight));
          heartFill.setAttribute("height", String(fillHeight));
          if (progress < 1) {
            requestAnimationFrame(load);
          } else {
            loader.classList.add("hidden");
            scene.classList.add("night");
            typeDedication();
          }
        }
        requestAnimationFrame(load);
      }

      window.addEventListener("resize", resizeCanvases);
      document.getElementById("replay").addEventListener("click", startScene);
      document.getElementById("fireworkAgain").addEventListener("click", launchHeartFirework);

      // Paralaje 3D con el mouse o inclinando el teléfono
      window.addEventListener("pointermove", event => {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = (event.clientY / window.innerHeight) * 2 - 1;
      });
      document.addEventListener("pointerleave", () => { pointer.x = 0; pointer.y = 0; });
      window.addEventListener("deviceorientation", event => {
        if (event.gamma === null || event.beta === null) return;
        pointer.x = clamp(event.gamma / 30, -1, 1);
        pointer.y = clamp((event.beta - 45) / 30, -1, 1);
      });

      // Tocar el cielo lanza un fuego artificial 3D
      scene.addEventListener("pointerdown", event => {
        if (!scene.classList.contains("night") || event.target.closest("button")) return;
        fireworks.push(createSphereFirework(event.clientX, Math.min(event.clientY, window.innerHeight * .7)));
      });

      // Tulipanes con pétalos en capas, sombreado, venas, tallo y hojas con volumen
      function buildTulip(i, hue) {
        const c = (s, l, a = 1) => `hsla(${hue}, ${s}%, ${l}%, ${a})`;
        return `
        <svg class="tulip" viewBox="0 0 120 280">
          <defs>
            <linearGradient id="front${i}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="${c(95, 90)}"/><stop offset=".3" stop-color="${c(88, 74)}"/>
              <stop offset=".72" stop-color="${c(72, 54)}"/><stop offset="1" stop-color="${c(45, 28)}"/>
            </linearGradient>
            <linearGradient id="side${i}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="${c(85, 80)}"/><stop offset=".5" stop-color="${c(66, 50)}"/>
              <stop offset="1" stop-color="${c(48, 24)}"/>
            </linearGradient>
            <linearGradient id="back${i}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="${c(60, 60)}"/><stop offset="1" stop-color="${c(45, 20)}"/>
            </linearGradient>
            <radialGradient id="round${i}" cx=".38" cy=".38" r=".75">
              <stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
              <stop offset="1" stop-color="#0a0f2d" stop-opacity=".4"/>
            </radialGradient>
            <linearGradient id="stem${i}" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#1f4037"/><stop offset=".45" stop-color="#5f9a86"/><stop offset="1" stop-color="#1c3a32"/>
            </linearGradient>
            <linearGradient id="leaf${i}" x1="0" y1="1" x2=".35" y2="0">
              <stop offset="0" stop-color="#1d3c35"/><stop offset=".5" stop-color="#3d7666"/><stop offset="1" stop-color="#78ad97"/>
            </linearGradient>
          </defs>
          <path class="stem" stroke="url(#stem${i})" stroke-width="5.5" d="M60 264 C57 214 66 166 60 114"/>
          <path class="stem-shine" d="M58.6 262 C55.8 214 64.6 166 58.8 117"/>
          <g class="leaf">
            <path fill="url(#leaf${i})" d="M58 262 C30 240 14 198 22 146 C36 172 48 194 55 212 C60 228 62 246 60 262Z"/>
            <path fill="rgba(8, 25, 22, .32)" d="M58 262 C30 240 14 198 22 146 C34 184 48 222 59 258Z"/>
            <path class="leaf-rib" d="M59 258 C49 222 34 186 23 150"/>
          </g>
          <g class="leaf right">
            <path fill="url(#leaf${i})" d="M62 266 C92 244 106 212 104 168 C92 194 79 212 68 226 C63 236 61 250 62 266Z"/>
            <path fill="rgba(8, 25, 22, .3)" d="M62 266 C92 244 106 212 104 168 C90 206 74 236 63 262Z"/>
            <path class="leaf-rib" d="M63 262 C73 236 90 206 103 172"/>
          </g>
          <path fill="#3e7062" d="M54 112 C56 119 64 119 66 112 C62 115 58 115 54 112Z"/>
          <path class="petal" fill="url(#back${i})" stroke="${c(70, 75, .2)}" d="M60 104 C46 98 41 70 47 46 C52 54 56 58 60 60 C64 58 68 54 73 46 C79 70 74 98 60 104Z"/>
          <g class="petal-left">
            <path class="petal" fill="url(#side${i})" stroke="${c(80, 82, .35)}" d="M58 113 C38 108 30 84 34 62 C36 52 40 46 46 41 C50 56 57 70 61 84 C63 96 62 106 58 113Z"/>
            <path class="vein" d="M57 110 C46 98 38 76 45 45"/>
          </g>
          <g class="petal-right">
            <path class="petal" fill="url(#side${i})" stroke="${c(80, 82, .35)}" d="M62 113 C82 108 90 84 86 62 C84 52 80 46 74 41 C70 56 63 70 59 84 C57 96 58 106 62 113Z"/>
            <path class="vein" d="M63 110 C74 98 82 76 75 45"/>
          </g>
          <path class="petal" fill="url(#front${i})" stroke="${c(85, 85, .3)}" d="M60 115 C45 113 39 93 41 73 C42 60 48 50 60 37 C72 50 78 60 79 73 C81 93 75 113 60 115Z"/>
          <path fill="url(#round${i})" d="M60 115 C45 113 39 93 41 73 C42 60 48 50 60 37 C72 50 78 60 79 73 C81 93 75 113 60 115Z"/>
          <path class="vein" d="M60 112 C58 90 58 64 60 42 M54 110 C49 92 48 72 52 54 M66 110 C71 92 72 72 68 54"/>
          <path fill="rgba(255, 255, 255, .22)" d="M51 62 C48 76 48 92 53 106 C51 90 51 76 54 64Z"/>
          <path fill="none" stroke="rgba(225, 238, 255, .45)" stroke-width=".9" stroke-linecap="round" d="M61 38.5 C72 50 78 60 79 73 C80.5 88 77 104 68 112"/>
        </svg>`;
      }

      document.getElementById("garden").innerHTML = [218, 232, 206, 250, 224].map((hue, i) => buildTulip(i, hue)).join("");

      resizeCanvases();
      requestAnimationFrame(frame);
      startScene();
    })();
  </script>
</body>
